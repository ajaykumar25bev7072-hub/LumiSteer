services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-nvidia/Llama-3_3-Nemotron-Super-49B-v1_5}
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host"
    environment:
      - VITE_API_BASE=
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
